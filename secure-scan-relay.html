<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WFM Secure Scan Relay</title>
<style>html,body{margin:0;min-height:100%;background:#0f172a;font:15px Arial,sans-serif}body{min-height:100vh;display:grid;grid-template-rows:auto 1fr}.bar{padding:10px 14px;background:#111827;color:#cbd5e1;font-weight:800}.bar.ok{color:#86efac}.bar.bad{color:#fca5a5}iframe{width:100%;height:100%;min-height:calc(100vh - 42px);border:0;background:#f3f5f8}</style>
</head>
<body>
<div id="status" class="bar">Wachten op een WFM-scan…</div>
<iframe id="bridgeFrame" src="https://svanbergen99.github.io/Roosteroverzicht/rooster-scan-railway-bridge.html" title="Automatische beveiligde roosterscan bridge"></iframe>
<script>
(() => {
  'use strict';
  const PUBLIC_ORIGIN='https://svanbergen99.github.io';
  const WFM_ORIGIN='https://genesyswfm.hosting.corp';
  const status=document.getElementById('status');
  const frame=document.getElementById('bridgeFrame');
  let payload=null;
  let timer=0;
  let tries=0;

  function text(value,kind=''){status.className=`bar${kind?` ${kind}`:''}`;status.textContent=value}
  function forward(){
    if(!payload)return;
    clearInterval(timer);tries=0;
    const send=()=>{
      tries++;
      try{frame.contentWindow?.postMessage({type:'secure-roster-scan',relay:'wfm-secure-scan-relay-v1',payload},PUBLIC_ORIGIN)}catch(_){}
      if(tries>=40){clearInterval(timer);text('De scan is ontvangen, maar de beveiligde bridge gaf nog geen bevestiging. Laat dit venster open.','bad')}
    };
    send();timer=setInterval(send,250)
  }
  frame.addEventListener('load',()=>{if(payload)forward()});
  window.addEventListener('message',event=>{
    const data=event.data||{};
    if(event.origin===WFM_ORIGIN&&data.type==='wfm-live-scan'&&Array.isArray(data?.payload?.schedules)){
      payload=data.payload;text('WFM-scan ontvangen. Doorsturen naar de beveiligde bridge…');
      try{event.source?.postMessage({type:'wfm-live-ack',receivedAt:new Date().toISOString()},WFM_ORIGIN)}catch(_){}
      forward();return
    }
    if(event.origin===PUBLIC_ORIGIN&&event.source===frame.contentWindow&&data.type==='secure-roster-scan-ack'){
      clearInterval(timer);text('Scan veilig bij de Roosteroverzicht-bridge afgeleverd.','ok');
      try{window.focus()}catch(_){}
    }
  });
})();
</script>
</body>
</html>
