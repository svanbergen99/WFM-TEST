name: Temporary Av34 black login transition updater
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/temp-av34-black-login-transition.yml"
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Av34
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          # A-test page: version bump + clearly different accent only.
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'TESTVARIANT · Av33' not in s or "data.version==='av33'" not in s:
              raise SystemExit('Expected Av33 baseline not found in index.html')
          s=s.replace('Av33','Av34').replace('AV33','AV34').replace('av33','av34')
          colors={
            '#1d4ed8':'#c2410c', '#2563eb':'#f97316', '#1e40af':'#9a3412',
            '#dbeafe':'#ffedd5', '#93c5fd':'#fdba74',
            'rgba(29,78,216,.25)':'rgba(194,65,12,.25)',
            'rgba(30,64,175,.14)':'rgba(154,52,18,.14)',
            'rgba(37,99,235,.26)':'rgba(249,115,22,.26)',
            'rgba(37,99,235,.32)':'rgba(249,115,22,.32)'
          }
          for old,new in colors.items(): s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')

          # A-test bookmarklet: version bump only.
          p=Path('WFM-Auto-Login-Scanner-Bookmarklet-v30a.txt')
          s=p.read_text(encoding='utf-8')
          if 'WFM Scanner Av33' not in s or 'version:"av33"' not in s:
              raise SystemExit('Expected Av33 bookmarklet baseline not found')
          s=s.replace('Av33','Av34').replace('AV33','AV34').replace('av33','av34')
          p.write_text(s,encoding='utf-8')

          # A-test base: immediately close the login cutout when Log in is pressed,
          # keep repainting across navigation, hold a pure black screen, then let the
          # already-fullscreen MP4 replace black as soon as processing starts.
          p=Path('wfm-auto-base-v30a.js')
          s=p.read_text(encoding='utf-8')
          if "A.OVERLAY_ID='wfm-auto-overlay-v33';" not in s:
              raise SystemExit('Expected Av33 base baseline not found')
          s=s.replace("A.OVERLAY_ID='wfm-auto-overlay-v33';","A.OVERLAY_ID='wfm-auto-overlay-v34';",1)
          s=s.replace("wfm-auto-preload-video-v33","wfm-auto-preload-video-v34")

          old="A.running=false;A.done=false;A.CLICK_THROUGH_SCAN=true;A.transitionMediaTime=0;A.transitionPaintTimer=null;"
          new="A.running=false;A.done=false;A.CLICK_THROUGH_SCAN=true;A.transitionMediaTime=0;A.transitionPaintTimer=null;A.loginSubmitted=false;A.loginSubmitAt=0;"
          if old not in s:
              raise SystemExit('base state anchor not found')
          s=s.replace(old,new,1)

          anchor="A.preloadVideo=()=>{try{let v=document.getElementById('wfm-auto-preload-video-v34');if(v)return v;v=document.createElement('video');v.id='wfm-auto-preload-video-v34';v.src=A.VIDEO_URL;v.preload='auto';v.playsInline=true;v.muted=true;v.defaultMuted=true;v.volume=0;v.style.cssText='position:fixed;width:1px;height:1px;left:-20px;top:-20px;opacity:.001;pointer-events:none';(document.body||document.documentElement).appendChild(v);try{v.load()}catch(_){}return v}catch(_){return null}};\n"
          insert=anchor+"A.coverLoginNow=()=>{try{if(A.loginSubmitted)return;A.loginSubmitted=true;A.loginSubmitAt=Date.now();A.restoreLoginShift();if(!A.transitionPaintTimer)A.transitionPaintTimer=setInterval(()=>A.paintOverlay(),16);A.paintOverlay()}catch(_){}};\nA.armLoginCover=d=>{try{if(!d||d.__wfmAutoLoginCoverV34)return;d.__wfmAutoLoginCoverV34=true;const trigger=()=>A.coverLoginNow();d.addEventListener('submit',e=>{try{const f=e.target;if(f?.querySelector?.('input[type=\\\"password\\\"]'))trigger()}catch(_){}},true);d.addEventListener('click',e=>{try{const el=e.target?.closest?.('button,input[type=\\\"submit\\\"],input[type=\\\"button\\\"],[role=\\\"button\\\"]');if(el&&/log\\s*in|login|sign\\s*in|aanmeld/i.test(A.txt(el)))trigger()}catch(_){}},true)}catch(_){}};\n"
          if anchor not in s:
              raise SystemExit('preload anchor not found')
          s=s.replace(anchor,insert,1)

          old="  const loginPage=/\\/wfm\\/Login\\.jsp/i.test(href),processing=A.ui.mode==='processing',showLoginHole=loginPage&&!processing;\n  if(processing){try{d.documentElement?.style.setProperty('background','#1f2937','important');d.body?.style.setProperty('background','#1f2937','important')}catch(_){}}\n  if(showLoginHole)A.centerLoginShift();else A.restoreLoginShift();"
          new="  const loginPage=/\\/wfm\\/Login\\.jsp/i.test(href),processing=A.ui.mode==='processing',transitionBlack=A.loginSubmitted&&!processing,showLoginHole=loginPage&&!processing&&!A.loginSubmitted;\n  if(loginPage&&!A.loginSubmitted)A.armLoginCover(d);\n  if(processing||transitionBlack){try{const bg=transitionBlack?'#000':'#2b1220';d.documentElement?.style.setProperty('background',bg,'important');d.body?.style.setProperty('background',bg,'important')}catch(_){}}\n  if(showLoginHole)A.centerLoginShift();else A.restoreLoginShift();"
          if old not in s:
              raise SystemExit('paintOverlay login anchor not found')
          s=s.replace(old,new,1)

          old="  const blockingBase='position:fixed;background:#1f2937;pointer-events:auto;margin:0;padding:0;border:0;z-index:1;';\n  const clickThroughBase='position:fixed;background:#1f2937;pointer-events:none;margin:0;padding:0;border:0;z-index:1;';"
          new="  const maskBg=transitionBlack?'#000':'#2b1220';\n  const blockingBase=`position:fixed;background:${maskBg};pointer-events:auto;margin:0;padding:0;border:0;z-index:1;`;\n  const clickThroughBase=`position:fixed;background:${maskBg};pointer-events:none;margin:0;padding:0;border:0;z-index:1;`;"
          if old not in s:
              raise SystemExit('mask base anchor not found')
          s=s.replace(old,new,1)

          s=s.replace("background:#1f2937;pointer-events:none;z-index:2':'display:none'","background:#000;pointer-events:none;z-index:2':'display:none'",1)
          s=s.replace('0 0 0 9999px #1f2937;pointer-events:none','0 0 0 9999px #2b1220;pointer-events:none',1)
          s=s.replace('rgba(219,234,254,.62)','rgba(255,237,213,.62)',1)
          s=s.replace('rgba(147,197,253,.18)','rgba(253,186,116,.18)',1)

          old="A.setMode=mode=>{A.ui.mode=mode||'login';if(A.ui.mode==='processing'){if(!A.transitionPaintTimer)A.transitionPaintTimer=setInterval(()=>A.paintOverlay(),16)}else if(A.transitionPaintTimer){clearInterval(A.transitionPaintTimer);A.transitionPaintTimer=null}A.paint();A.report()};"
          new="A.setMode=mode=>{A.ui.mode=mode||'login';if(A.ui.mode==='processing'){A.loginSubmitted=true;if(!A.transitionPaintTimer)A.transitionPaintTimer=setInterval(()=>A.paintOverlay(),16)}else if(!A.loginSubmitted&&A.transitionPaintTimer){clearInterval(A.transitionPaintTimer);A.transitionPaintTimer=null}A.paint();A.report()};"
          if old not in s:
              raise SystemExit('setMode anchor not found')
          s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          PY

          node --check wfm-auto-base-v30a.js
          git diff --check
          grep -q 'TESTVARIANT · Av34' index.html
          grep -q "data.version==='av34'" index.html
          grep -q 'WFM Scanner Av34' WFM-Auto-Login-Scanner-Bookmarklet-v30a.txt
          grep -q 'version:"av34"' WFM-Auto-Login-Scanner-Bookmarklet-v30a.txt
          grep -q "A.OVERLAY_ID='wfm-auto-overlay-v34'" wfm-auto-base-v30a.js
          grep -q 'A.coverLoginNow' wfm-auto-base-v30a.js
          grep -q 'A.armLoginCover' wfm-auto-base-v30a.js
          grep -q "transitionBlack?'#000'" wfm-auto-base-v30a.js
          grep -q 'width:100vw;height:100vh' wfm-auto-base-v30a.js
          grep -q 'object-fit:cover' wfm-auto-base-v30a.js

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/temp-av34-black-login-transition.yml
          git add index.html WFM-Auto-Login-Scanner-Bookmarklet-v30a.txt wfm-auto-base-v30a.js
          git diff --cached --name-only | sort > /tmp/changed
          printf '%s\n' '.github/workflows/temp-av34-black-login-transition.yml' 'WFM-Auto-Login-Scanner-Bookmarklet-v30a.txt' 'index.html' 'wfm-auto-base-v30a.js' | sort > /tmp/expected
          diff -u /tmp/expected /tmp/changed
          git commit -m 'Av34: black login-to-video transition'
          git push origin main
