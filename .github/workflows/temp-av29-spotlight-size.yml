name: Temporary Av29 spotlight sizing update
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-av29-spotlight-size.yml'
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Av29
        shell: bash
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'TESTVARIANT · Av28' not in s or "data.version==='av28'" not in s:
              raise SystemExit('Expected Av28 A-test baseline not found in index.html')
          s=s.replace('Av28','Av29').replace('AV28','AV29').replace('av28','av29')
          colors={
              '#be123c':'#6d28d9',
              '#e11d48':'#8b5cf6',
              '#9f1239':'#7e22ce',
              '#ffe4e6':'#ede9fe',
              '#fda4af':'#c4b5fd',
              'rgba(190,18,60,.25)':'rgba(109,40,217,.25)',
              'rgba(159,18,57,.14)':'rgba(126,34,206,.14)',
              'rgba(225,29,72,.26)':'rgba(139,92,246,.26)',
              'rgba(225,29,72,.32)':'rgba(139,92,246,.32)'
          }
          for old,new in colors.items():
              s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')

          p=Path('WFM-Auto-Login-Scanner-Bookmarklet-v30a.txt')
          s=p.read_text(encoding='utf-8')
          if 'WFM Scanner Av28' not in s or 'version:"av28"' not in s:
              raise SystemExit('Expected Av28 bookmarklet baseline not found')
          s=s.replace('Av28','Av29').replace('AV28','AV29').replace('av28','av29')
          p.write_text(s,encoding='utf-8')

          p=Path('wfm-auto-base-v30a.js')
          s=p.read_text(encoding='utf-8')
          if "A.OVERLAY_ID='wfm-auto-overlay-v28';" not in s:
              raise SystemExit('Expected Av28 overlay id not found')
          s=s.replace("A.OVERLAY_ID='wfm-auto-overlay-v28';","A.OVERLAY_ID='wfm-auto-overlay-v29';",1)

          old="let width=Math.max(360,coreWidth+72);width=Math.min(width,420,Math.max(280,w.innerWidth-28));"
          new="const sidePad=Math.max(28,Math.min(34,coreWidth*.10));let width=coreWidth+sidePad*2;width=Math.min(width,390,Math.max(280,w.innerWidth-28));"
          if old not in s:
              raise SystemExit('Expected Av28 spotlight width calculation not found')
          s=s.replace(old,new,1)

          s=s.replace('background:#083344;pointer-events:auto','background:#3b1d0f;pointer-events:auto',1)
          s=s.replace('background:#083344;pointer-events:none','background:#3b1d0f;pointer-events:none',1)
          s=s.replace('0 0 0 9999px #083344;pointer-events:none','0 0 0 9999px #3b1d0f;pointer-events:none',1)
          s=s.replace('rgba(255,228,230,.62)','rgba(237,233,254,.62)',1)
          s=s.replace('rgba(251,113,133,.18)','rgba(196,181,253,.18)',1)
          p.write_text(s,encoding='utf-8')
          PY

          node --check wfm-auto-base-v30a.js
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' 'WFM-Auto-Login-Scanner-Bookmarklet-v30a.txt' 'index.html' 'wfm-auto-base-v30a.js' | sort)"
          test "$changed" = "$expected"
          grep -q 'TESTVARIANT · Av29' index.html
          grep -q "data.version==='av29'" index.html
          grep -q 'WFM Scanner Av29' WFM-Auto-Login-Scanner-Bookmarklet-v30a.txt
          grep -q 'version:"av29"' WFM-Auto-Login-Scanner-Bookmarklet-v30a.txt
          grep -q "A.OVERLAY_ID='wfm-auto-overlay-v29'" wfm-auto-base-v30a.js
          grep -q 'const sidePad=Math.max(28,Math.min(34,coreWidth\*.10))' wfm-auto-base-v30a.js
          grep -q 'background:#3b1d0f' wfm-auto-base-v30a.js

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html WFM-Auto-Login-Scanner-Bookmarklet-v30a.txt wfm-auto-base-v30a.js
          git commit -m 'Av29: equalize spotlight side margins'
          git push origin main
