name: Temporary Av22 polish
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/av22-polish.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact Av22 payloads
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import gzip, base64, subprocess
          INDEX = """"""
          BOOKMARKLET = """"""
          Path("index.html").write_bytes(gzip.decompress(base64.b64decode(INDEX)))
          Path("WFM-Auto-Login-Scanner-Bookmarklet-v30a.txt").write_bytes(gzip.decompress(base64.b64decode(BOOKMARKLET)))
          expected = {
              "index.html":"9f9406532666e51b2ac8a55e60a87e789771d249",
              "WFM-Auto-Login-Scanner-Bookmarklet-v30a.txt":"b652576fc0fc58e2250fe71ad62f5fbf2c3e29df",
          }
          for path, sha in expected.items():
              got = subprocess.check_output(["git","hash-object",path], text=True).strip()
              if got != sha:
                  raise SystemExit(f"{path}: expected {sha}, got {got}")
          PY
      - name: Commit Av22
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html WFM-Auto-Login-Scanner-Bookmarklet-v30a.txt
          git diff --cached --quiet || git commit -m "Av22: polish A scanner flow and transitions"
          git push
