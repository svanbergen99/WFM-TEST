name: Temporary Av25 index update
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-av25-overlay.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Av25 page labels and accent
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'TESTVARIANT · Av24' not in s or 'version==="av24"' not in s:
              raise SystemExit('Av24 baseline not found in index')
          s=s.replace('Av24','Av25').replace('av24','av25').replace('AV24','AV25')
          colors={
              '#6d28d9':'#0891b2',
              '#8b5cf6':'#06b6d4',
              '#5b21b6':'#0e7490',
              '#ddd6fe':'#cffafe',
              '#a78bfa':'#67e8f9',
              'rgba(109,40,217,.25)':'rgba(8,145,178,.25)',
              'rgba(91,33,182,.12)':'rgba(14,116,144,.14)',
              'rgba(139,92,246,.26)':'rgba(6,182,212,.26)',
              'rgba(139,92,246,.32)':'rgba(6,182,212,.32)'
          }
          for old,new in colors.items():
              s=s.replace(old,new)
          if 'TESTVARIANT · Av24' in s or 'version==="av24"' in s:
              raise SystemExit('Old Av24 A-version remains')
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
          test "$(git diff --name-only)" = "index.html"
          grep -q 'TESTVARIANT · Av25' index.html
          grep -q 'Rooster · Av25' index.html
          grep -q 'version==="av25"' index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Av25: update A page labels and accent'
          git push
