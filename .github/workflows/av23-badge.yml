name: Temporary Av23 badge fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/av23-badge.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Av23 badge
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'AV22' not in s: raise SystemExit('AV22 badge not found')
          s=s.replace('AV22','AV23')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Av23: fix popup version badge'
          git push
