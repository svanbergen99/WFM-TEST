name: Av36 version fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/av36-version-fix.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fix internal Av36 ids
        shell: python
        run: |
          from pathlib import Path
          p=Path('wfm-auto-base-v30a.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('v35','v36').replace('V35','V36')
          p.write_text(s,encoding='utf-8')
      - name: Verify
        run: |
          node --check wfm-auto-base-v30a.js
          grep -q "wfm-auto-overlay-v36" wfm-auto-base-v30a.js
          ! grep -q "v35" wfm-auto-base-v30a.js
      - name: Commit
        run: |
          rm -f .github/workflows/av36-version-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Av36: finalize internal version ids"
          git push origin HEAD:main
