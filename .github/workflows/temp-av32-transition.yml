name: Temporary Av32 transition updater
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/temp-av32-transition.yml"
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply Av32
        shell: bash
        run: |
          set -euo pipefail
          git show HEAD^:.github/workflows/temp-av32-transition.yml > /tmp/av32-old.yml
          python3 <<'PY'
          from pathlib import Path
          s=Path('/tmp/av32-old.yml').read_text(encoding='utf-8')
          marker='        run: |\n'
          if marker not in s:
              raise SystemExit('Previous Av32 run block not found')
          body=s.split(marker,1)[1]
          lines=[]
          for line in body.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          script='\n'.join(lines)+'\n'
          script=script.replace('changed="$(git diff --name-only | sort)"','changed="$(git diff HEAD --name-only | sort)"')
          Path('/tmp/apply-av32.sh').write_text(script,encoding='utf-8')
          PY
          bash /tmp/apply-av32.sh
