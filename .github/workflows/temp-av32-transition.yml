name: Temporary Av32 transition updater
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/temp-av32-transition.yml"
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Av32
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          # index.html: bump A-version, change A-accent, add persistent transition audio.
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'TESTVARIANT · Av31' not in s or "data.version==='av31'" not in s:
              raise SystemExit('Expected Av31 baseline not found in index.html')
          s = s.replace('Av31','Av32').replace('AV31','AV32').replace('av31','av32')
          colors = {
              '#0f766e':'#be123c',
              '#14b8a6':'#e11d48',
              '#115e59':'#9f1239',
              '#ccfbf1':'#ffe4e6',
              '#5eead4':'#fda4af',
              'rgba(15,118,110,.25)':'rgba(190,18,60,.25)',
              'rgba(17,94,89,.14)':'rgba(159,18,57,.14)',
              'rgba(20,184,166,.26)':'rgba(225,29,72,.26)',
              'rgba(20,184,166,.32)':'rgba(225,29,72,.32)'
          }
          for old,new in colors.items():
              s = s.replace(old,new)

          old = "const A_INSTALL_KEY='wfmScannerV30AInstalled';\nlet wfmWindow=null,scannerHelperWindow=null,bookmarkletCode='',bookmarkletCodeA='',guideWindow=null,currentScanMessage=null,currentMonthIndex=0,scannerDragStartedA=false,scannerReadyForSessionA=false,scannerWatchdogA=null,scannerActivationPendingA=false;"
          new = "const A_INSTALL_KEY='wfmScannerV30AInstalled';\nconst A_TRANSITION_VIDEO='ff%20wachte.mp4';\nlet wfmWindow=null,scannerHelperWindow=null,bookmarkletCode='',bookmarkletCodeA='',guideWindow=null,currentScanMessage=null,currentMonthIndex=0,scannerDragStartedA=false,scannerReadyForSessionA=false,scannerWatchdogA=null,scannerActivationPendingA=false,transitionMediaA=null,transitionMediaActiveA=false,transitionSyncTimerA=null;\nfunction ensureTransitionMediaA(){if(transitionMediaA)return transitionMediaA;try{const v=document.createElement('video');v.src=A_TRANSITION_VIDEO;v.preload='auto';v.playsInline=true;v.loop=false;v.muted=false;v.defaultMuted=false;v.volume=1;v.style.cssText='position:fixed;width:1px;height:1px;left:-20px;top:-20px;opacity:.001;pointer-events:none';document.body.appendChild(v);try{v.load()}catch(_){}transitionMediaA=v;return v}catch(_){return null}}\nfunction primeTransitionMediaA(){const v=ensureTransitionMediaA();if(!v)return;try{v.muted=true;v.volume=0;const p=v.play();p?.then(()=>{try{v.pause();v.currentTime=0;v.muted=false;v.defaultMuted=false;v.volume=1}catch(_){}}).catch(()=>{try{v.muted=false;v.defaultMuted=false;v.volume=1}catch(_){}})}catch(_){}}\nfunction startTransitionMediaA(){const v=ensureTransitionMediaA();if(!v)return;if(!transitionMediaActiveA){transitionMediaActiveA=true;try{v.currentTime=0}catch(_){}}try{v.muted=false;v.defaultMuted=false;v.volume=1;const p=v.play();p?.catch?.(()=>{})}catch(_){}if(!transitionSyncTimerA)transitionSyncTimerA=setInterval(()=>{try{if(scannerHelperWindow&&!scannerHelperWindow.closed&&transitionMediaA)scannerHelperWindow.postMessage({type:'wfm-transition-media-time',currentTime:transitionMediaA.currentTime||0},WFM_ORIGIN)}catch(_){}},80)}\nfunction stopTransitionMediaA(){transitionMediaActiveA=false;if(transitionSyncTimerA){clearInterval(transitionSyncTimerA);transitionSyncTimerA=null}try{if(transitionMediaA){transitionMediaA.pause();transitionMediaA.currentTime=0;transitionMediaA.muted=false;transitionMediaA.defaultMuted=false;transitionMediaA.volume=1}}catch(_){}}"
          if old not in s:
              raise SystemExit('Index transition anchor not found')
          s = s.replace(old,new,1)

          old = "function startRoosterFlowA(){showCheckGateA();setTimeout(()=>{if(scannerInstalledA()||scannerReadyForSessionA){openWfmA(6000);return}showInstallGateA(false)},180)}"
          new = "function startRoosterFlowA(){primeTransitionMediaA();showCheckGateA();setTimeout(()=>{if(scannerInstalledA()||scannerReadyForSessionA){openWfmA(6000);return}showInstallGateA(false)},180)}"
          if old not in s:
              raise SystemExit('startRoosterFlowA anchor not found')
          s = s.replace(old,new,1)

          old = "  if(data.type==='wfm-scanner-status'){\n    if(scannerHelperWindow&&event.source!==scannerHelperWindow)return;\n    scannerHelperWindow=event.source;return\n  }"
          new = "  if(data.type==='wfm-scanner-status'){\n    if(scannerHelperWindow&&event.source!==scannerHelperWindow)return;\n    scannerHelperWindow=event.source;\n    if(data.mode==='processing')startTransitionMediaA();\n    else if(data.mode==='login'||data.mode==='error')stopTransitionMediaA();\n    return\n  }"
          if old not in s:
              raise SystemExit('scanner status anchor not found')
          s = s.replace(old,new,1)

          old = "  cancelScannerWatchdogA();scannerHelperWindow=event.source;closeGuide();render(data);"
          new = "  cancelScannerWatchdogA();stopTransitionMediaA();scannerHelperWindow=event.source;closeGuide();render(data);"
          if old not in s:
              raise SystemExit('scan receive anchor not found')
          s = s.replace(old,new,1)

          old = "window.addEventListener('beforeunload',()=>{cancelScannerWatchdogA();closeGuide()});"
          new = "window.addEventListener('beforeunload',()=>{cancelScannerWatchdogA();stopTransitionMediaA();closeGuide()});"
          if old not in s:
              raise SystemExit('beforeunload anchor not found')
          s = s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # Bookmarklet: version bump only.
          p = Path('WFM-Auto-Login-Scanner-Bookmarklet-v30a.txt')
          s = p.read_text(encoding='utf-8')
          if 'WFM Scanner Av31' not in s or 'version:"av31"' not in s:
              raise SystemExit('Expected Av31 bookmarklet baseline not found')
          s = s.replace('Av31','Av32').replace('AV31','AV32').replace('av31','av32')
          p.write_text(s,encoding='utf-8')

          # Scanner overlay: fullscreen visual video, dark navigation canvas and fast repaint.
          p = Path('wfm-auto-base-v30a.js')
          s = p.read_text(encoding='utf-8')
          if "A.OVERLAY_ID='wfm-auto-overlay-v31';" not in s:
              raise SystemExit('Expected Av31 base baseline not found')
          s = s.replace("A.OVERLAY_ID='wfm-auto-overlay-v31';","A.OVERLAY_ID='wfm-auto-overlay-v32';",1)

          old = "A.running=false;A.done=false;A.CLICK_THROUGH_SCAN=true;"
          new = "A.running=false;A.done=false;A.CLICK_THROUGH_SCAN=true;A.transitionMediaTime=0;A.transitionPaintTimer=null;"
          if old not in s:
              raise SystemExit('base state anchor not found')
          s = s.replace(old,new,1)

          old = "A.txt=e=>String(e?.innerText||e?.textContent||e?.value||'').replace(/\\s+/g,' ').trim();"
          new = "A.txt=e=>String(e?.innerText||e?.textContent||e?.value||'').replace(/\\s+/g,' ').trim();\nwindow.addEventListener('message',e=>{try{if(e.origin!==A.TEST_ORIGIN)return;const m=e.data||{};if(m.type==='wfm-transition-media-time'&&Number.isFinite(Number(m.currentTime)))A.transitionMediaTime=Number(m.currentTime)||0}catch(_){}});"
          if old not in s:
              raise SystemExit('A.txt anchor not found')
          s = s.replace(old,new,1)

          old = "  const video=root.querySelector('[data-wfm-video]');if(video){video.src=A.VIDEO_URL;video.muted=false;video.defaultMuted=false;video.volume=1;video.loop=false;video.playsInline=true;}"
          new = "  const video=root.querySelector('[data-wfm-video]');if(video){video.src=A.VIDEO_URL;video.preload='auto';video.muted=true;video.defaultMuted=true;video.volume=0;video.loop=false;video.playsInline=true;try{video.load()}catch(_){}}"
          if old not in s:
              raise SystemExit('video setup anchor not found')
          s = s.replace(old,new,1)

          old = "  const loginPage=/\\/wfm\\/Login\\.jsp/i.test(href),processing=A.ui.mode==='processing',showLoginHole=loginPage&&!processing;"
          new = "  const loginPage=/\\/wfm\\/Login\\.jsp/i.test(href),processing=A.ui.mode==='processing',showLoginHole=loginPage&&!processing;\n  if(processing){try{d.documentElement?.style.setProperty('background','#102a1f','important');d.body?.style.setProperty('background','#102a1f','important')}catch(_){}}"
          if old not in s:
              raise SystemExit('processing anchor not found')
          s = s.replace(old,new,1)

          old = "    if(video){video.style.cssText=processing?'display:block;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(980px,92vw);max-height:calc(100vh - 48px);object-fit:contain;border-radius:24px;background:#000;pointer-events:none;z-index:2':'display:none';if(processing){video.muted=false;video.defaultMuted=false;video.volume=1;if(video.paused&&!video.ended){try{const p=video.play();p?.catch?.(()=>{})}catch(_){}}}else{try{video.pause();if(video.currentTime)video.currentTime=0}catch(_){}}}"
          new = "    if(video){video.style.cssText=processing?'display:block;position:fixed;inset:0;width:100vw;height:100vh;max-width:none;max-height:none;object-fit:cover;border-radius:0;background:#102a1f;pointer-events:none;z-index:2':'display:none';if(processing){video.muted=true;video.defaultMuted=true;video.volume=0;const mt=Number(A.transitionMediaTime)||0;try{if(mt>0&&Math.abs((video.currentTime||0)-mt)>.30&&!video.seeking)video.currentTime=mt}catch(_){}if(video.paused&&!video.ended){try{const p=video.play();p?.catch?.(()=>{})}catch(_){}}}else{try{video.pause();if(video.currentTime)video.currentTime=0}catch(_){}}}"
          if old not in s:
              raise SystemExit('processing video block not found')
          s = s.replace(old,new,1)

          old = "A.setMode=mode=>{A.ui.mode=mode||'login';A.paint();A.report()};"
          new = "A.setMode=mode=>{A.ui.mode=mode||'login';if(A.ui.mode==='processing'){if(!A.transitionPaintTimer)A.transitionPaintTimer=setInterval(()=>A.paintOverlay(),16)}else if(A.transitionPaintTimer){clearInterval(A.transitionPaintTimer);A.transitionPaintTimer=null}A.paint();A.report()};"
          if old not in s:
              raise SystemExit('setMode anchor not found')
          s = s.replace(old,new,1)

          old = "A.removeOverlay=()=>{try{A.restoreLoginShift();A.targetDoc()?.getElementById(A.OVERLAY_ID)?.remove()}catch(_){} };"
          new = "A.removeOverlay=()=>{try{if(A.transitionPaintTimer){clearInterval(A.transitionPaintTimer);A.transitionPaintTimer=null}A.restoreLoginShift();A.targetDoc()?.getElementById(A.OVERLAY_ID)?.remove()}catch(_){} };"
          if old not in s:
              raise SystemExit('removeOverlay anchor not found')
          s = s.replace(old,new,1)

          s = s.replace('background:#2a1038;pointer-events:auto','background:#102a1f;pointer-events:auto',1)
          s = s.replace('background:#2a1038;pointer-events:none','background:#102a1f;pointer-events:none',1)
          s = s.replace('0 0 0 9999px #2a1038;pointer-events:none','0 0 0 9999px #102a1f;pointer-events:none',1)
          s = s.replace('rgba(204,251,241,.62)','rgba(255,228,230,.62)',1)
          s = s.replace('rgba(94,234,212,.18)','rgba(253,164,175,.18)',1)
          p.write_text(s,encoding='utf-8')
          PY

          node --check wfm-auto-base-v30a.js
          git diff --check
          grep -q 'TESTVARIANT · Av32' index.html
          grep -q "data.version==='av32'" index.html
          grep -q 'WFM Scanner Av32' WFM-Auto-Login-Scanner-Bookmarklet-v30a.txt
          grep -q 'version:"av32"' WFM-Auto-Login-Scanner-Bookmarklet-v30a.txt
          grep -q "A.OVERLAY_ID='wfm-auto-overlay-v32'" wfm-auto-base-v30a.js
          grep -q 'width:100vw;height:100vh' wfm-auto-base-v30a.js
          grep -q 'object-fit:cover' wfm-auto-base-v30a.js
          grep -q 'transitionMediaA' index.html
          grep -q 'wfm-transition-media-time' wfm-auto-base-v30a.js
          grep -q 'background:#102a1f' wfm-auto-base-v30a.js

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/temp-av32-transition.yml
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/temp-av32-transition.yml' 'WFM-Auto-Login-Scanner-Bookmarklet-v30a.txt' 'index.html' 'wfm-auto-base-v30a.js' | sort)"
          test "$changed" = "$expected"
          git add index.html WFM-Auto-Login-Scanner-Bookmarklet-v30a.txt wfm-auto-base-v30a.js
          git commit -m 'Av32: smooth fullscreen transition and reliable audio'
          git push origin main
