name: Temporary Av35 video quality updater
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/temp-av35-video-quality-once.yml"
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Av35
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'TESTVARIANT · Av34' not in s or "data.version==='av34'" not in s:
              raise SystemExit('Expected Av34 baseline not found in index.html')
          s=s.replace('Av34','Av35').replace('AV34','AV35').replace('av34','av35')
          css_replacements={
            '.variant-card{border-top:4px solid #c2410c}':'.variant-card{border-top:4px solid #7c3aed}',
            '.variant-card .bookmarklet{background:#f97316}':'.variant-card .bookmarklet{background:#8b5cf6}',
            '.login-btn-a{margin-top:14px;background:#c2410c;box-shadow:0 12px 30px rgba(194,65,12,.25)}':'.login-btn-a{margin-top:14px;background:#7c3aed;box-shadow:0 12px 30px rgba(124,58,237,.25)}',
            'border:1px solid #ffedd5;border-radius:11px;padding:10px 14px;background:#fff;color:#9a3412':'border:1px solid #ede9fe;border-radius:11px;padding:10px 14px;background:#fff;color:#6d28d9',
            'box-shadow:0 8px 18px rgba(154,52,18,.14)':'box-shadow:0 8px 18px rgba(109,40,217,.14)',
            'background:#fff;color:#9a3412;font-size:16px':'background:#fff;color:#6d28d9;font-size:16px',
            '.scanner-install-gate .bookmarklet{width:min(520px,100%);min-height:78px;margin:0 auto;background:#f97316;font-size:22px;box-shadow:0 18px 50px rgba(249,115,22,.26)':'.scanner-install-gate .bookmarklet{width:min(520px,100%);min-height:78px;margin:0 auto;background:#8b5cf6;font-size:22px;box-shadow:0 18px 50px rgba(139,92,246,.26)',
            'box-shadow:0 22px 58px rgba(249,115,22,.32)':'box-shadow:0 22px 58px rgba(139,92,246,.32)',
            'border-top-color:#f97316':'border-top-color:#8b5cf6'
          }
          for old,new in css_replacements.items():
              if old not in s:
                  raise SystemExit(f'Index CSS anchor missing: {old}')
              s=s.replace(old,new,1)
          old='function startTransitionMediaA(){const v=ensureTransitionMediaA();if(!v)return;if(!transitionMediaActiveA)'
          new='function startTransitionMediaA(){const v=ensureTransitionMediaA();if(!v||v.ended)return;if(!transitionMediaActiveA)'
          if old not in s:
              raise SystemExit('Transition media start anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          p=Path('WFM-Auto-Login-Scanner-Bookmarklet-v30a.txt')
          s=p.read_text(encoding='utf-8')
          if 'WFM Scanner Av34' not in s or 'version:"av34"' not in s:
              raise SystemExit('Expected Av34 bookmarklet baseline not found')
          s=s.replace('Av34','Av35').replace('AV34','AV35').replace('av34','av35')
          p.write_text(s,encoding='utf-8')

          p=Path('wfm-auto-base-v30a.js')
          s=p.read_text(encoding='utf-8')
          checks=["A.OVERLAY_ID='wfm-auto-overlay-v34';",'wfm-auto-preload-video-v34','__wfmAutoLoginCoverV34','object-fit:cover','const maskBg=transitionBlack?\'#000\':\'#2b1220\';']
          for x in checks:
              if x not in s:
                  raise SystemExit(f'Base anchor missing: {x}')
          s=s.replace("A.OVERLAY_ID='wfm-auto-overlay-v34';","A.OVERLAY_ID='wfm-auto-overlay-v35';",1)
          s=s.replace('wfm-auto-preload-video-v34','wfm-auto-preload-video-v35')
          s=s.replace('__wfmAutoLoginCoverV34','__wfmAutoLoginCoverV35')
          s=s.replace("const bg=transitionBlack?'#000':'#2b1220';","const bg='#000';",1)
          s=s.replace("const maskBg=transitionBlack?'#000':'#2b1220';","const maskBg=(transitionBlack||processing)?'#000':'#0d1f2d';",1)
          s=s.replace('object-fit:cover;border-radius:0;background:#000;','object-fit:contain;object-position:center center;border-radius:0;background:#000;',1)
          s=s.replace('try{if(mt>0&&Math.abs((video.currentTime||0)-mt)>.30&&!video.seeking)video.currentTime=mt}catch(_){}','try{if(!video.ended&&mt>0&&Math.abs((video.currentTime||0)-mt)>.30&&!video.seeking)video.currentTime=mt}catch(_){}',1)
          s=s.replace('rgba(255,237,213,.62)','rgba(237,233,254,.62)',1)
          s=s.replace('rgba(253,186,116,.18)','rgba(196,181,253,.18)',1)
          s=s.replace('0 0 0 9999px #2b1220;pointer-events:none','0 0 0 9999px #0d1f2d;pointer-events:none',1)
          p.write_text(s,encoding='utf-8')
          PY

          node --check wfm-auto-base-v30a.js
          git diff --check
          grep -q 'TESTVARIANT · Av35' index.html
          grep -q "data.version==='av35'" index.html
          grep -q 'WFM Scanner Av35' WFM-Auto-Login-Scanner-Bookmarklet-v30a.txt
          grep -q 'version:"av35"' WFM-Auto-Login-Scanner-Bookmarklet-v30a.txt
          grep -q "A.OVERLAY_ID='wfm-auto-overlay-v35'" wfm-auto-base-v30a.js
          grep -q 'object-fit:contain;object-position:center center' wfm-auto-base-v30a.js
          grep -q 'if(!v||v.ended)return;if(!transitionMediaActiveA)' index.html
          grep -q '!video.ended&&mt>0' wfm-auto-base-v30a.js
          grep -q "maskBg=(transitionBlack||processing)" wfm-auto-base-v30a.js

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/temp-av35-video-quality-once.yml
          git add index.html WFM-Auto-Login-Scanner-Bookmarklet-v30a.txt wfm-auto-base-v30a.js
          git diff --cached --name-only | sort > /tmp/changed
          printf '%s\n' '.github/workflows/temp-av35-video-quality-once.yml' 'WFM-Auto-Login-Scanner-Bookmarklet-v30a.txt' 'index.html' 'wfm-auto-base-v30a.js' | sort > /tmp/expected
          diff -u /tmp/expected /tmp/changed
          git commit -m 'Av35: preserve video aspect ratio and play once'
          git push origin main
