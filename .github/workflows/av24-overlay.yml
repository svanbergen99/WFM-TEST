name: Temporary Av24 overlay refinement
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/av24-overlay.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Av24 login overlay refinement
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # A-page: version bump + clearly different Av24 accent colour.
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'TESTVARIANT · Av23' not in s:
              raise SystemExit('Av23 baseline not found in index')
          s=s.replace('Av23','Av24').replace('av23','av24').replace('AV23','AV24')
          colors={
              '#a16207':'#6d28d9',
              '#eab308':'#8b5cf6',
              '#854d0e':'#5b21b6',
              '#fde68a':'#ddd6fe',
              '#facc15':'#a78bfa',
              'rgba(161,98,7,.25)':'rgba(109,40,217,.25)',
              'rgba(133,77,14,.12)':'rgba(91,33,182,.12)',
              'rgba(234,179,8,.26)':'rgba(139,92,246,.26)',
              'rgba(234,179,8,.32)':'rgba(139,92,246,.32)'
          }
          for old,new in colors.items():
              s=s.replace(old,new)
          if 'Av23' in s or 'av23' in s or 'AV23' in s:
              raise SystemExit('Old Av23 marker remains in index')
          p.write_text(s,encoding='utf-8')

          # A bookmarklet: exact current-version handshake remains enforced.
          b=Path('WFM-Auto-Login-Scanner-Bookmarklet-v30a.txt')
          t=b.read_text(encoding='utf-8')
          if 'Av23' not in t or 'version:"av23"' not in t:
              raise SystemExit('Av23 bookmarklet baseline not found')
          t=t.replace('Av23','Av24').replace('av23','av24')
          if 'Av23' in t or 'av23' in t:
              raise SystemExit('Old Av23 marker remains in bookmarklet')
          b.write_text(t,encoding='utf-8')

          # A overlay only: tighten the horizontal login cut-out around the actual fields.
          base=Path('wfm-auto-base-v30a.js')
          u=base.read_text(encoding='utf-8')
          old="let left=Math.min(...rs.map(r=>r.left))-60,right=Math.max(...rs.map(r=>r.right))+60,top=Math.min(...rs.map(r=>r.top))-215,bottom=Math.max(...rs.map(r=>r.bottom))+55;"
          new="let left=Math.min(...rs.map(r=>r.left))-24,right=Math.max(...rs.map(r=>r.right))+24,top=Math.min(...rs.map(r=>r.top))-215,bottom=Math.max(...rs.map(r=>r.bottom))+55;"
          if old not in u:
              raise SystemExit('Expected Av23 login cut-out formula not found')
          u=u.replace(old,new,1)
          old_min="if(right-left<420){const c=(left+right)/2;left=Math.max(12,c-210);right=Math.min(w.innerWidth-12,c+210)}"
          new_min="if(right-left<360){const c=(left+right)/2;left=Math.max(12,c-180);right=Math.min(w.innerWidth-12,c+180)}"
          if old_min not in u:
              raise SystemExit('Expected Av23 minimum login width not found')
          u=u.replace(old_min,new_min,1)
          old_frame="border:2px solid rgba(255,255,255,.72);border-radius:18px;box-shadow:0 0 0 1px rgba(0,0,0,.65);"
          new_frame="border:1px solid rgba(255,255,255,.58);border-radius:22px;box-shadow:0 12px 42px rgba(0,0,0,.38);"
          if old_frame not in u:
              raise SystemExit('Expected Av23 login frame style not found')
          u=u.replace(old_frame,new_frame,1)
          base.write_text(u,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html WFM-Auto-Login-Scanner-Bookmarklet-v30a.txt wfm-auto-base-v30a.js
          git diff --cached --quiet || git commit -m 'Av24: refine login overlay cutout'
          git push
