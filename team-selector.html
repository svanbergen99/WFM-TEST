<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WFM Team Selector | WAITING</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#fff;background:#05070b}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#05070b}body{display:grid;place-items:center;overflow:hidden}.panel{width:min(390px,calc(100vw - 36px));text-align:center}.panel h1{font-size:25px;margin:0 0 22px}.panel p{margin:0 0 14px;color:#aeb7c6;font-size:14px;line-height:1.45}.select-wrap{position:relative}select{width:100%;appearance:none;border:1px solid #394150;border-radius:12px;background:#111827;color:#fff;padding:15px 44px 15px 16px;font-size:16px;font-weight:700;outline:none;cursor:pointer}.select-wrap:after{content:'▼';position:absolute;right:16px;top:50%;transform:translateY(-50%);pointer-events:none;color:#cbd5e1;font-size:12px}.loading{display:none}.spinner{width:34px;height:34px;margin:0 auto 18px;border:4px solid #273244;border-top-color:#fff;border-radius:50%;animation:spin .75s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.loading h2{margin:0 0 8px;font-size:24px}.loading p{margin:0;color:#aeb7c6}
</style>
</head>
<body>
<section id="chooser" class="panel">
  <h1>Selecteer je team</h1>
  <div class="select-wrap">
    <select id="teamSelect" aria-label="Kies team">
      <option value="">Kies team</option>
      <option value="KCD Team 3">KCD Team 3</option>
    </select>
  </div>
</section>
<section id="loading" class="panel loading">
  <div class="spinner"></div>
  <h2>Rooster ophalen…</h2>
  <p>WFM wordt nu gescand. Dit venster sluit vanzelf zodra de actuele roosterdata terug is.</p>
</section>
<script>
(()=>{
'use strict';
const chooser=document.getElementById('chooser');
const loading=document.getElementById('loading');
const select=document.getElementById('teamSelect');
let started=false;
select.addEventListener('change',()=>{
  const team=select.value;
  if(started||team!=='KCD Team 3')return;
  started=true;
  chooser.style.display='none';
  loading.style.display='block';
  document.title='WFM_SCAN_REQUEST_KCD_TEAM_3';
  try{window.opener?.postMessage({type:'wfm-team-selected',team},location.origin)}catch(_){}
});
window.addEventListener('message',event=>{
  if(event.origin!==location.origin)return;
  if(event.data?.type!=='wfm-scan-complete')return;
  document.title='WFM Team Selector | COMPLETE';
  const h=loading.querySelector('h2');
  const p=loading.querySelector('p');
  if(h)h.textContent='Rooster ontvangen';
  if(p)p.textContent='Het actuele rooster wordt geopend.';
  setTimeout(()=>window.close(),120);
});
})();
</script>
</body>
</html>
