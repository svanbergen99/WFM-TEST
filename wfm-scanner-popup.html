<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WFM Scanner</title>
<style>
:root{font-family:Segoe UI,Arial,sans-serif;color:#0f172a;background:transparent}*{box-sizing:border-box}html,body{margin:0;background:transparent}body{padding:8px}.card{width:100%;background:#fff;border:1px solid #dbe2ea;border-radius:16px;box-shadow:0 14px 38px rgba(15,23,42,.22);padding:15px}.head{display:flex;align-items:center;gap:10px}.dot{width:11px;height:11px;border-radius:50%;background:#94a3b8;box-shadow:0 0 0 4px rgba(148,163,184,.14)}.dot.ok{background:#16a34a}.dot.busy{background:#f59e0b}.dot.bad{background:#dc2626}h1{font-size:19px;margin:0}.sub{margin:5px 0 12px;color:#64748b;font-size:12px;line-height:1.35}.label{font-size:11px;font-weight:900;color:#64748b;text-transform:uppercase;letter-spacing:.05em;margin:10px 0 7px}.nav{display:grid;grid-template-columns:1fr 1fr;gap:7px}.nav button,.btn{border:0;border-radius:10px;font-weight:800;cursor:pointer}.nav button{min-height:40px;padding:8px;background:#e8eef6;color:#172033;font-size:12px}.nav button.wide{grid-column:1/-1;background:#dbeafe;color:#1d4ed8}.nav button:disabled,.btn:disabled{opacity:.5;cursor:not-allowed}.btn{width:100%;height:45px;background:#111827;color:#fff;font-size:14px}.status{margin-top:10px;padding:9px 10px;border-radius:10px;background:#f1f5f9;color:#475569;font-size:12px;line-height:1.35;min-height:44px}.close{width:100%;margin-top:6px;border:0;background:transparent;color:#64748b;font-size:12px;cursor:pointer;padding:6px}
</style>
</head>
<body>
<div class="card">
  <div class="head"><span id="dot" class="dot"></span><h1>WFM Scanner</h1></div>
  <p class="sub">Gebruik deze knoppen om WFM zelf te bedienen. Buiten dit paneel kun je de WFM-pagina ook gewoon handmatig blijven gebruiken.</p>
  <div class="label">Navigatie</div>
  <div class="nav">
    <button id="mySchedule" type="button" disabled>My Schedule</button>
    <button id="otherSchedules" type="button" disabled>Other Schedules</button>
    <button id="calendarToday" class="wide" type="button" disabled>Calendar → vandaag</button>
  </div>
  <div class="label">Scan</div>
  <button id="scan" class="btn" type="button" disabled>Deze pagina scannen</button>
  <div id="status" class="status">Wachten op verbinding met WFM…</div>
  <button id="close" class="close" type="button">Scannerpaneel sluiten</button>
</div>
<script>
(()=>{
'use strict';
const WFM_ORIGIN='https://genesyswfm.hosting.corp';
const $=id=>document.getElementById(id),dot=$('dot'),scan=$('scan'),status=$('status'),closeBtn=$('close');
const navButtons=[$('mySchedule'),$('otherSchedules'),$('calendarToday')];
const host=()=>{try{if(window.parent&&window.parent!==window)return window.parent;if(window.opener&&!window.opener.closed)return window.opener}catch(_){}return null};
let connected=false,running=false;
function setState(kind,text){dot.className='dot'+(kind?' '+kind:'');status.textContent=text}
function enableControls(on){scan.disabled=!on;for(const b of navButtons)b.disabled=!on}
function command(name,text){if(!connected||running)return;setState('busy',text);try{host()?.postMessage({type:'wfm-popup-command',command:name},WFM_ORIGIN)}catch(e){setState('bad',e?.message||String(e))}}
window.addEventListener('message',e=>{
  if(e.origin!==WFM_ORIGIN)return;if(host()&&e.source!==host())return;const d=e.data||{};
  if(d.type==='wfm-popup-connected'){connected=true;running=false;enableControls(true);setState('ok','Verbonden met WFM. Kies een navigatieknop of scan de huidige pagina.');return}
  if(d.type==='wfm-popup-status'){
    if(d.status==='running'){running=true;enableControls(false);scan.textContent='Bezig met scannen…';setState('busy',d.text||'Scanner gestart…')}
    else if(d.status==='error'){running=false;enableControls(true);scan.textContent='Deze pagina scannen';setState('bad',d.text||'Actie mislukt.')}
    else if(d.status==='ready'){running=false;enableControls(true);scan.textContent='Deze pagina scannen';setState('ok',d.text||'Klaar.')}
  }
});
async function startScan(){
  if(!connected||running)return;running=true;enableControls(false);scan.textContent='Bezig met scannen…';setState('busy','Scanner-code laden…');
  try{const r=await fetch('WFM-Planning-Scan-Current-Secure-Bookmarklet.txt?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('Scanner-code kon niet worden geladen.');const code=(await r.text()).trim();if(!code.startsWith('javascript:'))throw new Error('Ongeldige scanner-code ontvangen.');const target=host();if(!target)throw new Error('Het WFM-venster is niet meer beschikbaar.');target.postMessage({type:'wfm-popup-run-scanner',code},WFM_ORIGIN);setState('busy','Huidige WFM-weergave wordt verwerkt…')}catch(err){running=false;enableControls(true);scan.textContent='Deze pagina scannen';setState('bad',err?.message||String(err))}
}
$('mySchedule').addEventListener('click',()=>command('my-schedule','My Schedule openen…'));
$('otherSchedules').addEventListener('click',()=>command('other-schedules','Other Schedules openen…'));
$('calendarToday').addEventListener('click',()=>command('calendar-today','Calendar openen en vandaag selecteren…'));
scan.addEventListener('click',startScan);
closeBtn.addEventListener('click',()=>{try{host()?.postMessage({type:'wfm-popup-close-panel'},WFM_ORIGIN)}catch(_){};if(window.opener)window.close()});
})();
</script>
</body>
</html>
