<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WFM Scanner</title>
<style>
:root{font-family:Segoe UI,Arial,sans-serif;color:#0f172a;background:transparent}
*{box-sizing:border-box}html,body{margin:0;background:transparent}body{padding:8px}.card{width:100%;background:#fff;border:1px solid #dbe2ea;border-radius:16px;box-shadow:0 14px 38px rgba(15,23,42,.22);padding:16px}.head{display:flex;align-items:center;gap:10px}.dot{width:11px;height:11px;border-radius:50%;background:#94a3b8;box-shadow:0 0 0 4px rgba(148,163,184,.14)}.dot.ok{background:#16a34a;box-shadow:0 0 0 4px rgba(22,163,74,.14)}.dot.busy{background:#f59e0b;box-shadow:0 0 0 4px rgba(245,158,11,.14)}.dot.bad{background:#dc2626;box-shadow:0 0 0 4px rgba(220,38,38,.14)}h1{font-size:19px;margin:0}.sub{margin:5px 0 14px;color:#64748b;font-size:12px;line-height:1.35}.team{padding:9px 11px;border:1px solid #e2e8f0;border-radius:10px;background:#f8fafc;font-size:13px;font-weight:700;margin-bottom:11px}.btn{width:100%;height:46px;border:0;border-radius:11px;background:#111827;color:#fff;font-size:15px;font-weight:800;cursor:pointer}.btn:disabled{opacity:.5;cursor:not-allowed}.status{margin-top:10px;padding:9px 10px;border-radius:10px;background:#f1f5f9;color:#475569;font-size:12px;line-height:1.35;min-height:44px}.close{width:100%;margin-top:7px;border:0;background:transparent;color:#64748b;font-size:12px;cursor:pointer;padding:7px}
</style>
</head>
<body>
<div class="card">
  <div class="head"><span id="dot" class="dot"></span><h1>WFM Scanner</h1></div>
  <p class="sub">Dit paneel blijft staan. Je kunt ondertussen gewoon in WFM achter het paneel blijven klikken en handmatig van pagina/week wisselen.</p>
  <div class="team">Handmatige weekscan</div>
  <button id="scan" class="btn" type="button" disabled>Deze pagina scannen</button>
  <div id="status" class="status">Wachten op verbinding met WFM…</div>
  <button id="close" class="close" type="button">Scannerpaneel sluiten</button>
</div>
<script>
(()=>{
'use strict';
const WFM_ORIGIN='https://genesyswfm.hosting.corp';
const dot=document.getElementById('dot'),scan=document.getElementById('scan'),status=document.getElementById('status'),closeBtn=document.getElementById('close');
const host=()=>{try{if(window.parent&&window.parent!==window)return window.parent;if(window.opener&&!window.opener.closed)return window.opener}catch(_){}return null};
let connected=false,running=false;
function setState(kind,text){dot.className='dot'+(kind?' '+kind:'');status.textContent=text}
window.addEventListener('message',e=>{
  if(e.origin!==WFM_ORIGIN)return;
  if(host()&&e.source!==host())return;
  const d=e.data||{};
  if(d.type==='wfm-popup-connected'){
    connected=true;running=false;scan.disabled=false;scan.textContent='Deze pagina scannen';setState('ok','Verbonden. Navigeer in WFM naar de gewenste week/pagina en klik daarna op scannen.');
  }
  if(d.type==='wfm-popup-status'){
    if(d.status==='running'){running=true;scan.disabled=true;scan.textContent='Bezig met scannen…';setState('busy',d.text||'Scanner gestart in WFM…')}
    else if(d.status==='error'){running=false;scan.disabled=false;scan.textContent='Deze pagina scannen';setState('bad',d.text||'Scanner kon niet starten.')}
    else if(d.status==='ready'){running=false;scan.disabled=false;scan.textContent='Deze pagina scannen';setState('ok',d.text||'Klaar voor de volgende scan.')}
  }
});
async function startScan(){
  if(!connected||running)return;
  running=true;scan.disabled=true;scan.textContent='Bezig met scannen…';setState('busy','Scanner-code laden…');
  try{
    const r=await fetch('WFM-Planning-Scan-Current-Secure-Bookmarklet.txt?v='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw new Error('Scanner-code kon niet worden geladen.');
    const code=(await r.text()).trim();
    if(!code.startsWith('javascript:'))throw new Error('Ongeldige scanner-code ontvangen.');
    const target=host();if(!target)throw new Error('Het WFM-venster is niet meer beschikbaar.');
    target.postMessage({type:'wfm-popup-run-scanner',code},WFM_ORIGIN);
    setState('busy','Huidige WFM-weergave wordt verwerkt…');
  }catch(err){running=false;scan.disabled=false;scan.textContent='Deze pagina scannen';setState('bad',err?.message||String(err))}
}
scan.addEventListener('click',startScan);
closeBtn.addEventListener('click',()=>{try{host()?.postMessage({type:'wfm-popup-close-panel'},WFM_ORIGIN)}catch(_){};if(window.opener)window.close()});
})();
</script>
</body>
</html>
