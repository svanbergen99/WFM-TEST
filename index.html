<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rooster WFM Test</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#172033;background:#eef1f5;--accent:#5b4bc4;--line:#dbe2ea;--muted:#64748b;--surface:#fff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#eef1f5}.start{min-height:100vh;display:grid;place-items:center;padding:24px}.login-btn{border:0;border-radius:14px;padding:17px 28px;background:#059669;color:#fff;font-size:18px;font-weight:800;cursor:pointer;box-shadow:0 12px 30px rgba(5,150,105,.25)}.wrap{max-width:1440px;margin:auto;padding:28px 14px 60px}.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 12px 35px rgba(15,23,42,.08);margin-bottom:16px}.status{padding:12px 14px;border-radius:10px;background:#eef2ff;margin-bottom:16px}.ok{background:#e9f8ef;color:#216a43}.bad{background:#fdecec;color:#8b3030}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.stat{padding:12px;border-radius:10px;background:#f5f6fa}.stat b{display:block;font-size:22px}.scan-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap}.scan-title{margin:0 0 4px}.scan-sub{color:var(--muted);font-size:14px}.calendar-stack{display:grid;gap:18px;margin-top:18px}.month-card{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}.month-title{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 17px;background:#f8f7fc;border-bottom:1px solid var(--line)}.month-title h3{margin:0;font-size:21px;text-transform:capitalize}.month-title span{color:var(--muted);font-size:13px;font-weight:700}.weekdays,.month-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.weekdays{background:#fafbfc;border-bottom:1px solid var(--line)}.weekday{padding:9px 8px;text-align:center;color:#64748b;font-size:12px;font-weight:800;text-transform:uppercase}.day{min-height:150px;padding:9px;border-right:1px solid #e7ebf0;border-bottom:1px solid #e7ebf0;background:#fff;overflow:hidden}.day:nth-child(7n){border-right:0}.day.outside{background:#f7f8fa;color:#a5adba}.day.today{box-shadow:inset 0 0 0 2px rgba(91,75,196,.55);background:#fbfaff}.day-number{display:flex;align-items:center;justify-content:space-between;gap:5px;margin-bottom:7px;font-size:13px;font-weight:800}.today-badge{font-size:10px;background:var(--accent);color:#fff;border-radius:999px;padding:2px 6px}.no-data{color:#a0a8b5;font-size:11px;margin-top:9px}.shift{border:1px solid #e0e5eb;border-radius:9px;background:#f9fafb;margin-top:6px;overflow:hidden}.shift-time{padding:6px 7px;background:#f1f3f6;font-size:12px;font-weight:800}.activities{padding:5px 6px;display:grid;gap:4px}.activity{position:relative;padding:5px 6px 5px 10px;background:#fff;border:1px solid #edf0f3;border-radius:6px;font-size:10.5px;line-height:1.28;overflow-wrap:anywhere}.activity::before{content:"";position:absolute;left:3px;top:4px;bottom:4px;width:3px;border-radius:4px;background:var(--activity-color,#cbd5e1)}.activity-time{display:block;color:#667085;font-size:9.5px;margin-top:1px}details{margin-top:16px}pre{white-space:pre-wrap;word-break:break-word;background:#111827;color:#e5e7eb;padding:12px;border-radius:10px;max-height:420px;overflow:auto}@media(max-width:760px){.wrap{padding:14px 8px 40px}.card{padding:15px}.stats{grid-template-columns:repeat(2,1fr)}.calendar-scroll{overflow-x:auto;padding-bottom:4px}.calendar-inner{min-width:840px}.day{min-height:145px}}
</style>
</head>
<body>
<section id="start" class="start"><button id="openWfm" class="login-btn" type="button">Rooster Log in</button></section>
<main id="content" class="wrap" hidden><div id="status" class="status" hidden></div><section id="result" class="card" hidden></section></main>
<script>
(()=>{
'use strict';
const WFM_ORIGIN='https://genesyswfm.hosting.corp';
const WFM_URL=`${WFM_ORIGIN}/wfm/Login.jsp`;
const STORAGE_KEY='wfm-test-last-live-scan';
const MONTHS=['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];
const WEEKDAYS=['ma','di','wo','do','vr','za','zo'];
const start=document.getElementById('start'),content=document.getElementById('content'),status=document.getElementById('status'),result=document.getElementById('result'),openButton=document.getElementById('openWfm');
let wfmWindow=null,watchTimer=null;
window.name='wfmTestReceiver';
try{sessionStorage.removeItem(STORAGE_KEY)}catch(_){}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[c]));}
function countActivities(s){return s.reduce((n,d)=>n+(Array.isArray(d.activities)?d.activities.length:0),0)}
function spanDays(a,b){if(!a||!b)return 0;return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000)+1}
function dateKeyLocal(date=new Date()){const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Amsterdam',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(date),g=t=>p.find(x=>x.type===t)?.value||'';return`${g('year')}-${g('month')}-${g('day')}`}
function shiftMonth(k,a){const[y,m]=k.split('-').map(Number),d=new Date(Date.UTC(y,m-1+a,1));return`${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}`}
function monthsBetween(a,b){if(!/^\d{4}-\d{2}-\d{2}$/.test(a)||!/^\d{4}-\d{2}-\d{2}$/.test(b))return[];const out=[];let k=a.slice(0,7),e=b.slice(0,7),g=0;while(k<=e&&g++<24){out.push(k);k=shiftMonth(k,1)}return out}
function safeColor(v){return/^#[0-9a-f]{6}$/i.test(String(v||''))?String(v):'#cbd5e1'}
function range(a,b){return a&&b?`${a}–${b}`:(a||b||'')}
function showStatus(text,kind=''){content.hidden=false;status.hidden=false;status.className='status'+(kind?' '+kind:'');status.textContent=text}
function buildMonth(monthKey,schedules,first,last){const[y,m]=monthKey.split('-').map(Number),rows=schedules.filter(s=>String(s.date||'').slice(0,7)===monthKey),byDate=new Map();for(const s of rows){const k=String(s.date||'').slice(0,10);if(!byDate.has(k))byDate.set(k,[]);byDate.get(k).push(s)}const dim=new Date(Date.UTC(y,m,0)).getUTCDate(),fw=new Date(Date.UTC(y,m-1,1,12)).getUTCDay(),lead=(fw+6)%7,total=lead+dim<=35?35:42,today=dateKeyLocal(),cells=[];for(let i=0;i<total;i++){const day=i-lead+1;if(day<1||day>dim){cells.push('<div class="day outside"></div>');continue}const k=`${y}-${String(m).padStart(2,'0')}-${String(day).padStart(2,'0')}`,dayRows=byDate.get(k)||[],inside=(!first||k>=first)&&(!last||k<=last),shifts=dayRows.map(s=>{const acts=(Array.isArray(s.activities)?s.activities:[]).map(a=>`<div class="activity" style="--activity-color:${safeColor(a.color)}">${esc(a.name||a.type||'Activiteit')}<span class="activity-time">${esc(range(a.start,a.end))}</span></div>`).join('');return`<div class="shift"><div class="shift-time">${esc(range(s.start,s.end)||'Rooster')}</div>${acts?`<div class="activities">${acts}</div>`:''}</div>`}).join('');cells.push(`<div class="day${k===today?' today':''}"><div class="day-number"><span>${day}</span>${k===today?'<span class="today-badge">Vandaag</span>':''}</div>${shifts||(inside?'<div class="no-data">Geen roosterdata</div>':'')}</div>`)}return`<section class="month-card"><header class="month-title"><h3>${MONTHS[m-1]} ${y}</h3><span>${rows.length} roosterregel${rows.length===1?'':'s'}</span></header><div class="calendar-scroll"><div class="calendar-inner"><div class="weekdays">${WEEKDAYS.map(d=>`<div class="weekday">${d}</div>`).join('')}</div><div class="month-grid">${cells.join('')}</div></div></div></section>`}
function render(message){const payload=message?.payload||{},schedules=Array.isArray(payload.schedules)?payload.schedules.slice():[];schedules.sort((a,b)=>String(a.date||'').localeCompare(String(b.date||''))||String(a.start||'').localeCompare(String(b.start||'')));const dates=[...new Set(schedules.map(x=>String(x.date||'').slice(0,10)).filter(x=>/^\d{4}-\d{2}-\d{2}$/.test(x)))].sort(),first=dates[0]||'',last=dates.at(-1)||'',activities=countActivities(schedules),months=monthsBetween(first,last),scheduleFor=payload?.source?.scheduleFor||'6 weeks';start.hidden=true;content.hidden=false;status.hidden=true;result.hidden=false;result.innerHTML=`<div class="scan-head"><div><h2 class="scan-title">Mijn Rooster — verse WFM-scan</h2><div class="scan-sub">${esc(scheduleFor)} · KCD Team 3 · ontvangen ${esc(new Date().toLocaleTimeString('nl-NL'))}</div></div></div><div class="stats"><div class="stat"><b>${dates.length}</b>unieke datums</div><div class="stat"><b>${spanDays(first,last)}</b>kalenderdagen</div><div class="stat"><b>${schedules.length}</b>roosterregels</div><div class="stat"><b>${activities}</b>activiteiten</div></div><div class="status ok">WFM LIVE SCAN ONTVANGEN<br>Periode: <b>${esc(first||'—')}</b> t/m <b>${esc(last||'—')}</b></div><div class="calendar-stack">${months.map(k=>buildMonth(k,schedules,first,last)).join('')||'<div class="status bad">Geen kalenderdata ontvangen.</div>'}</div><details><summary>Ruwe ontvangen JSON</summary><pre>${esc(JSON.stringify(message,null,2))}</pre></details>`}
function stopWatch(){if(watchTimer){clearInterval(watchTimer);watchTimer=null}}
function watchClose(){stopWatch();watchTimer=setInterval(()=>{if(!wfmWindow)return;let closed=false;try{closed=wfmWindow.closed}catch(_){return}if(!closed)return;stopWatch();wfmWindow=null;if(result.hidden){start.hidden=false;showStatus('WFM is gesloten voordat een scan werd ontvangen.','bad')}},250)}
function popupFeatures(){const w=430,h=520,left=Math.max(0,Math.round((screen.availWidth-w)/2)),top=Math.max(0,Math.round((screen.availHeight-h)/2));return`popup=yes,width=${w},height=${h},left=${left},top=${top},resizable=yes,scrollbars=yes`}
function openWfm(){result.hidden=true;status.hidden=true;content.hidden=true;try{wfmWindow=window.open(WFM_URL,'wfmLiveTestWindow',popupFeatures())}catch(_){wfmWindow=null}if(!wfmWindow){start.hidden=false;showStatus('WFM kon niet worden geopend. Sta popups toe voor deze testpagina.','bad');return}try{wfmWindow.focus()}catch(_){}watchClose()}
openButton.addEventListener('click',openWfm);
window.addEventListener('message',event=>{if(event.origin!==WFM_ORIGIN)return;if(wfmWindow&&event.source!==wfmWindow)return;const data=event.data;if(!data||data.type!=='wfm-live-scan'||!Array.isArray(data?.payload?.schedules))return;try{sessionStorage.setItem(STORAGE_KEY,JSON.stringify(data))}catch(_){}render(data);try{event.source?.postMessage({type:'wfm-live-ack',receivedAt:new Date().toISOString()},WFM_ORIGIN)}catch(_){}setTimeout(()=>{try{if(wfmWindow&&!wfmWindow.closed)wfmWindow.close()}catch(_){}wfmWindow=null},130)});
})();
</script>
</body>
</html>
